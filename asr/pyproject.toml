[project]
name = "real-time-chat-asr"
version = "0.1.0"
description = "Local Apple Silicon ASR service for real-time chat agents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=0.30",
    "librosa>=0.11",
    "mlx-speech>=0.4.0",
    "numpy>=2.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "uvicorn[standard]>=0.34",
    "websockets>=15.0",
]

[tool.uv]
package = false
