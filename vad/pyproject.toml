[project]
name = "real-time-chat-vad"
version = "0.1.0"
description = "Local Silero VAD service for real-time chat agents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "librosa>=0.11",
    "numpy>=2.0",
    "python-multipart>=0.0.20",
    "silero-vad[onnx-cpu]>=6.2.1",
    "soundfile>=0.13",
    "uvicorn[standard]>=0.34",
    "websockets>=15.0",
]

[tool.uv]
package = false
